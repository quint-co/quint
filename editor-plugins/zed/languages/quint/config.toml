name = "Quint"
grammar = "quint"
path_suffixes = ["qnt"]
line_comments = ["// "]
block_comment = ["/* ", " */"]
tab_size = 2
autoclose_before = ",;:.=})]"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
