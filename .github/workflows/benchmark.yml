name: Benchmark

on:
  merge_group:
  pull_request:
    types: [opened, synchronize]

# If new code is pushed to a PR branch, then cancel in progress workflows for that PR.
# Ensures that we don't waste CI time, and returns results quicker.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  GIT_LFS_SKIP_SMUDGE: 1

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      evaluator: ${{ steps.filter.outputs.evaluator }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            evaluator:
              - 'evaluator/**'

  benchmark:
    name: Run benchmarks
    needs: changes
    if: ${{ needs.changes.outputs.evaluator == 'true' }}
    runs-on: ubuntu-latest
    # Read-only on purpose: fork PRs never get a write token on `pull_request`.
    # The comment is posted by benchmark-comment.yml from the uploaded artifact.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./evaluator

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to fetch all history for comparison

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-critertion
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-criterion

      - name: Install node
        uses: actions/setup-node@v4

      # Branch names of fork PRs don't exist in this repo, so we work with SHAs.
      # HEAD is the merge of the PR into its base, and HEAD^1 is that base.
      - name: Record commits to compare
        id: commits
        run: |
          echo "pr=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "base=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
          fi

      # --- Run benchmarks on base (baseline) ---
      - name: Checkout base commit
        run: git checkout ${{ steps.commits.outputs.base }}

      - name: Install Quint (base)
        run: cd ../quint && npm ci && npm run compile && npm link

      - name: Build benchmarks (base)
        run: cargo build --release --benches

      - name: Run benchmarks (base)
        run: cargo criterion --message-format=json > baseline_results.json

      # --- Run benchmarks on PR branch ---
      - name: Checkout PR commit
        run: git checkout ${{ steps.commits.outputs.pr }}

      - name: Install Quint (PR)
        run: cd ../quint && npm ci && npm run compile && npm link

      - name: Build benchmarks (PR)
        run: cargo build --release --benches

      - name: Run benchmarks (PR)
        run: cargo criterion --message-format=json > benchmark_results.json

      # --- Compare results ---
      - name: Process benchmark results
        id: benchmark-processing
        uses: actions/github-script@v7
        env:
          # A benchmark slower than this (in %) fails the check
          REGRESSION_THRESHOLD: 10
        with:
          script: |
            const fs = require('fs');

            function formatTime(nanoseconds) {
              if (nanoseconds < 1000) {
                return `${nanoseconds.toFixed(2)} ns`;
              } else if (nanoseconds < 1000000) {
                return `${(nanoseconds / 1000).toFixed(2)} µs`;
              } else if (nanoseconds < 1000000000) {
                return `${(nanoseconds / 1000000).toFixed(2)} ms`;
              } else {
                return `${(nanoseconds / 1000000000).toFixed(2)} s`;
              }
            }

            function parseResults(filePath) {
              const map = new Map();
              fs.readFileSync(filePath, 'utf8')
                .split('\n')
                .filter(Boolean)
                .map(JSON.parse)
                .forEach(result => {
                  if (result.reason === 'benchmark-complete') {
                    map.set(result.id, result.mean.estimate);
                  }
                });
              return map;
            }

            const baseline = parseResults('evaluator/baseline_results.json');
            const current = parseResults('evaluator/benchmark_results.json');

            // Collect all benchmark names from both runs
            const allBenchmarks = new Set([...baseline.keys(), ...current.keys()]);

            let comment = '## Benchmark Results\n\n';
            comment += '| Benchmark | Main | PR | Change |\n';
            comment += '|-----------|------|-----|--------|\n';

            const threshold = Number(process.env.REGRESSION_THRESHOLD);
            const regressions = [];

            for (const name of allBenchmarks) {
              const baseTime = baseline.get(name);
              const currTime = current.get(name);

              if (baseTime != null && currTime != null) {
                const changePercent = ((currTime - baseTime) / baseTime) * 100;
                if (changePercent > threshold) {
                  regressions.push(`${name} (+${changePercent.toFixed(1)}%)`);
                }
                let changeStr;
                if (Math.abs(changePercent) < 2) {
                  changeStr = `${changePercent >= 0 ? '+' : ''}${changePercent.toFixed(1)}%`;
                } else if (changePercent > 0) {
                  changeStr = `+${changePercent.toFixed(1)}% :warning:`;
                } else {
                  changeStr = `${changePercent.toFixed(1)}% :rocket:`;
                }
                comment += `| ${name} | ${formatTime(baseTime)} | ${formatTime(currTime)} | ${changeStr} |\n`;
              } else if (baseTime == null) {
                comment += `| ${name} | — | ${formatTime(currTime)} | *new* |\n`;
              } else {
                comment += `| ${name} | ${formatTime(baseTime)} | — | *removed* |\n`;
              }
            }

            if (regressions.length > 0) {
              comment += `\n:x: ${regressions.length} benchmark(s) regressed by more than ${threshold}%.\n`;
            }

            await core.summary.addRaw(comment).write();
            fs.writeFileSync('benchmark-comment.md', comment);
            fs.writeFileSync('pr-number', String(context.payload.pull_request?.number ?? ''));
            core.setOutput('regressions', regressions.join(', '));

      - name: Upload comment for benchmark-comment.yml
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comment
          path: |
            benchmark-comment.md
            pr-number

      - name: Fail on significant regressions
        if: steps.benchmark-processing.outputs.regressions != ''
        env:
          REGRESSIONS: ${{ steps.benchmark-processing.outputs.regressions }}
        run: |
          echo "::error::Benchmarks regressed by more than the threshold: $REGRESSIONS"
          exit 1
